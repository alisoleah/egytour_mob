<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Egytour Login</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#17b0cf",
                        "background-light": "#f6f8f8",
                        "background-dark": "#111e21",
                        "surface-dark": "#1c2526",
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display antialiased text-slate-900 dark:text-white bg-background-light dark:bg-background-dark">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-hidden">
<!-- Background Image with Overlay -->
<div class="absolute inset-0 z-0 h-full w-full">
<img alt="Great Pyramids of Giza under a starry night sky" class="h-full w-full object-cover opacity-100 dark:opacity-60" data-alt="Great Pyramids of Giza under a starry night sky" src="https://lh3.googleusercontent.com/aida-public/AB6AXuArPWgRPcqhvZ4Az7xRELC9u9gkoc3WQ89NDfg5uINE3vwrNmNS4ck-ArvbOeSZ9AmmK0oJi6aZ44SBl_30mOCthRjYfEiSW7SQ7rhudgwdUnZBGlvnTXzSBF4lsdcPTOc6fTqfa4a1rkvyvB9W7cn92xIwyfUEfg1H9y_IW7vwMlCvFFHzagra4RmWIz-EJCXQEMZC5IUZ3DdUqgkB7bu2gTxqgXmLeE-nKkNtKBD6rsWIvBRcAefL0Hc8_6gazTiFa2ls_GWwHef_"/>
<!-- Gradient Overlay for readability -->
<div class="absolute inset-0 bg-gradient-to-b from-background-light/80 via-background-light/95 to-background-light dark:from-background-dark/70 dark:via-background-dark/90 dark:to-background-dark"></div>
</div>
<!-- Content Container -->
<div class="relative z-10 flex flex-col h-full w-full max-w-md mx-auto p-6 pt-8">
<!-- Top Bar (Simplified) -->
<div class="flex items-center justify-between mb-8">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-slate-800 dark:text-white">arrow_back</span>
</button>
<div class="font-bold text-lg tracking-tight text-primary">Egytour</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</div>
<!-- Headline -->
<div class="mb-8 text-center">
<h1 class="text-3xl font-bold leading-tight tracking-tight text-slate-900 dark:text-white mb-2">
                    Unlock the <br/><span class="text-primary">Mysteries of Egypt</span>
</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm">
                    Log in to access your offline maps and 3D tours.
                </p>
</div>
<!-- Segmented Control (Tabs) -->
<div class="flex h-12 w-full items-center justify-center rounded-lg bg-slate-200 dark:bg-[#293638] p-1 mb-8">
<!-- Log In Tab (Active) -->
<label class="flex cursor-pointer h-full flex-1 items-center justify-center rounded-[4px] bg-white dark:bg-background-dark shadow-sm text-slate-900 dark:text-white text-sm font-semibold transition-all">
<span>Log In</span>
<input checked="" class="hidden" name="auth_mode" type="radio" value="login"/>
</label>
<!-- Sign Up Tab (Inactive) -->
<label class="flex cursor-pointer h-full flex-1 items-center justify-center rounded-[4px] text-slate-500 dark:text-[#9db4b8] hover:text-slate-700 dark:hover:text-white text-sm font-medium transition-all">
<span>Sign Up</span>
<input class="hidden" name="auth_mode" type="radio" value="signup"/>
</label>
</div>
<!-- Form Fields -->
<form class="flex flex-col gap-5">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300">Email Address</label>
<div class="relative">
<input class="flex w-full rounded-lg border border-slate-300 dark:border-[#3c4f53] bg-white dark:bg-surface-dark px-4 py-3.5 pl-11 text-base text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-[#9db4b8] focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="you@example.com" type="email"/>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-[#9db4b8] pointer-events-none">mail</span>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300">Password</label>
</div>
<div class="relative">
<input class="flex w-full rounded-lg border border-slate-300 dark:border-[#3c4f53] bg-white dark:bg-surface-dark px-4 py-3.5 pl-11 pr-11 text-base text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-[#9db4b8] focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="Enter your password" type="password"/>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-[#9db4b8] pointer-events-none">lock</span>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-[#9db4b8] hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<div class="flex justify-end mt-1">
<a class="text-sm font-medium text-primary hover:text-primary/80 transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<!-- Submit Button -->
<button class="mt-2 flex w-full items-center justify-center rounded-lg bg-primary py-3.5 text-base font-bold text-white shadow-lg shadow-primary/25 hover:bg-primary/90 active:scale-[0.98] transition-all" type="button">
                    Log In
                </button>
</form>
<!-- Social Login / Divider -->
<div class="mt-8 mb-6">
<div class="relative flex items-center py-2">
<div class="grow border-t border-slate-300 dark:border-[#3c4f53]"></div>
<span class="mx-4 shrink-0 text-xs font-medium text-slate-500 dark:text-[#9db4b8]">Or continue with</span>
<div class="grow border-t border-slate-300 dark:border-[#3c4f53]"></div>
</div>
<div class="grid grid-cols-2 gap-4 mt-4">
<!-- Google Button -->
<button class="flex items-center justify-center gap-2 rounded-lg border border-slate-300 dark:border-[#3c4f53] bg-white dark:bg-surface-dark py-2.5 hover:bg-slate-50 dark:hover:bg-[#252f30] transition-colors">
<svg class="h-5 w-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-sm font-semibold text-slate-700 dark:text-white">Google</span>
</button>
<!-- Apple Button -->
<button class="flex items-center justify-center gap-2 rounded-lg border border-slate-300 dark:border-[#3c4f53] bg-white dark:bg-surface-dark py-2.5 hover:bg-slate-50 dark:hover:bg-[#252f30] transition-colors">
<svg class="h-5 w-5 text-black dark:text-white" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.05 20.28c-.98.95-2.05.88-3.08.38-1.09-.53-2.09-.5-3.2.06-1.53.78-3.08.34-4.22-1.78-2.31-4.34-.34-8.81 3.56-9.13 1.25-.13 2.53.5 3.38.5.78 0 2.22-1 3.66-1 .59.03 2.31.25 3.44 1.56-2.91 1.63-2.38 5.63.47 7.03-.66 1.72-1.56 3.47-3.01 4.38zm-2.09-15c-.47-2.22 1.94-4.13 3.84-4.28.16 2.34-2.5 4.63-3.84 4.28z"></path>
</svg>
<span class="text-sm font-semibold text-slate-700 dark:text-white">Apple</span>
</button>
</div>
</div>
<!-- Spacer to push footer to bottom if screen is tall -->
<div class="flex-grow"></div>
<!-- Footer -->
<div class="mt-4 text-center pb-4">
<p class="text-sm text-slate-500 dark:text-slate-400">
                    Don't have an account?
                    <button class="font-bold text-primary hover:text-primary/80 transition-colors ml-1" type="button">Sign Up</button>
</p>
</div>
</div>
</div>
</body></html>
