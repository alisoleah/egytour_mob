</label>

<span class="material-symbols-outlined text-[20px]">arrow_forward</span>

<p class="text-center text-xs text-[#8c7e73] dark:text-[#6e6359] mt-3">
            By clicking Pay, you agree to our Terms of Service.
        </p>
</div>
<script>
        // Simple script to handle radio button styling toggle
        const radios = document.querySelectorAll('input[name="payment_method"]');
        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                // Reset all labels
                radios.forEach(r => {
                    const label = r.closest('label');
                    label.classList.remove('border-primary', 'shadow-[0_0_15px_rgba(238,140,43,0.1)]');
                    label.classList.remove('border-2'); // remove active thickness
                    label.classList.add('border', 'border-[#e6dbd1]', 'dark:border-[#3d342b]'); // add inactive thickness
                });

                // Set active label
                const activeLabel = e.target.closest('label');
                activeLabel.classList.remove('border', 'border-[#e6dbd1]', 'dark:border-[#3d342b]');
                activeLabel.classList.add('border-2', 'border-primary', 'shadow-[0_0_15px_rgba(238,140,43,0.1)]');
            });
        });
    </script>
