<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Egytour Login</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "brand-orange": "#F26522","brand-dark-orange": "#D94E0F",
                        "brand-black": "#333333","brand-surface": "#FFFFFF",
                        "brand-bg": "#F9FAFB",
                        "brand-border": "#E5E7EB",
                        "brand-white": "#FFFFFF",
                        "brand-text-main": "#1F2937",
                        "brand-text-sub": "#6B7280",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "8px",
                        "lg": "12px",
                        "xl": "16px",
                        "2xl": "24px"
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'card': '0 10px 40px -10px rgba(0,0,0,0.08)'
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
<style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display antialiased text-brand-text-main bg-brand-bg">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-hidden">
<div class="absolute inset-0 z-0 h-full w-full pointer-events-none overflow-hidden">
<div class="absolute -top-20 -right-20 w-96 h-96 bg-brand-orange/5 rounded-full blur-3xl"></div>
<div class="absolute top-40 -left-20 w-72 h-72 bg-brand-black/5 rounded-full blur-2xl"></div>
<div class="absolute bottom-0 w-full h-1/3 bg-gradient-to-t from-white via-white/80 to-transparent"></div>
</div>
<div class="relative z-10 flex flex-col h-full w-full max-w-md mx-auto p-6 pt-8">
<div class="flex items-center justify-between mb-8">
<button class="flex items-center justify-center w-10 h-10 rounded-full border border-gray-200 bg-white shadow-sm hover:border-brand-orange text-brand-text-main transition-all group">
<span class="material-symbols-outlined text-[20px] group-hover:text-brand-orange transition-colors">arrow_back</span>
</button>
<div class="font-extrabold text-xl tracking-tight">
<span class="text-brand-black">e</span><span class="text-brand-orange">gy</span><span class="text-brand-orange">tour</span>
</div>
<div class="w-10"></div>
</div>
<div class="mb-8 relative">
<div class="absolute -left-6 top-2 h-12 w-1.5 bg-brand-orange rounded-r-full"></div>
<h1 class="text-3xl font-black leading-tight tracking-tight text-brand-text-main mb-2">
            EXPLORE<br/>
<span class="text-brand-orange">THE UNSEEN</span>
</h1>
<p class="text-brand-text-sub text-sm font-medium leading-relaxed max-w-xs">
            Unlock exclusive tours, 3D maps, and offline access.
        </p>
</div>
<div class="bg-white rounded-2xl p-6 shadow-card border border-gray-100">
<div class="flex w-full mb-8 border-b border-gray-100">
<label class="cursor-pointer relative flex-1 pb-3 text-center group">
<span class="text-sm font-bold uppercase tracking-wider text-brand-orange transition-colors">Log In</span>
<input checked="" class="hidden peer" name="auth_mode" type="radio" value="login"/>
<div class="absolute -bottom-[1px] left-0 w-full h-[3px] bg-brand-orange rounded-t-full scale-x-100 transition-transform origin-center peer-checked:scale-x-100 shadow-sm"></div>
</label>
<label class="cursor-pointer relative flex-1 pb-3 text-center group">
<span class="text-sm font-bold uppercase tracking-wider text-gray-400 group-hover:text-brand-text-main transition-colors">Register</span>
<input class="hidden peer" name="auth_mode" type="radio" value="signup"/>
<div class="absolute -bottom-[1px] left-0 w-full h-[3px] bg-brand-orange rounded-t-full scale-x-0 transition-transform origin-center peer-checked:scale-x-100 shadow-sm"></div>
</label>
</div>
<form class="flex flex-col gap-5">
<div class="flex flex-col gap-1.5">
<label class="text-[11px] font-bold uppercase tracking-wider text-brand-text-sub ml-1">Email Address</label>
<div class="relative group">
<input class="flex w-full rounded-xl border border-gray-200 bg-gray-50/50 px-4 py-3.5 pl-11 text-base font-medium text-brand-text-main placeholder:text-gray-400 focus:border-brand-orange focus:bg-white focus:ring-2 focus:ring-brand-orange/10 outline-none transition-all shadow-sm" placeholder="name@example.com" type="email"/>
<span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-brand-orange transition-colors text-[20px]">mail</span>
</div>
</div>
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-end ml-1">
<label class="text-[11px] font-bold uppercase tracking-wider text-brand-text-sub">Password</label>
</div>
<div class="relative group">
<input class="flex w-full rounded-xl border border-gray-200 bg-gray-50/50 px-4 py-3.5 pl-11 pr-11 text-base font-medium text-brand-text-main placeholder:text-gray-400 focus:border-brand-orange focus:bg-white focus:ring-2 focus:ring-brand-orange/10 outline-none transition-all shadow-sm" placeholder="Enter password" type="password"/>
<span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-brand-orange transition-colors text-[20px]">lock</span>
<button class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-brand-orange transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<div class="flex justify-end mt-1">
<a class="text-xs font-semibold text-brand-text-sub hover:text-brand-orange transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<button class="mt-2 relative overflow-hidden group w-full rounded-xl bg-gradient-to-r from-brand-orange to-brand-dark-orange py-4 text-sm font-bold uppercase tracking-widest text-white shadow-lg shadow-brand-orange/30 hover:shadow-brand-orange/50 hover:-translate-y-0.5 transition-all active:scale-[0.98] active:translate-y-0" type="button">
<div class="absolute inset-0 w-full h-full bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
<span class="relative z-10 flex items-center justify-center gap-2">
                    Access Account
                    <span class="material-symbols-outlined text-lg">arrow_forward</span>
</span>
</button>
</form>
<div class="mt-8 mb-6">
<div class="relative flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-gray-200"></div>
</div>
<span class="relative bg-white px-4 text-[10px] font-bold uppercase tracking-widest text-gray-400">Or continue with</span>
</div>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center gap-2 rounded-xl border border-gray-200 bg-white py-3 hover:bg-gray-50 hover:border-gray-300 transition-all shadow-sm">
<svg class="h-5 w-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-xs font-bold uppercase tracking-wide text-gray-700">Google</span>
</button>
<button class="flex items-center justify-center gap-2 rounded-xl border border-gray-200 bg-white py-3 hover:bg-gray-50 hover:border-gray-300 transition-all shadow-sm">
<svg class="h-5 w-5 text-black" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.05 20.28c-.98.95-2.05.88-3.08.38-1.09-.53-2.09-.5-3.2.06-1.53.78-3.08.34-4.22-1.78-2.31-4.34-.34-8.81 3.56-9.13 1.25-.13 2.53.5 3.38.5.78 0 2.22-1 3.66-1 .59.03 2.31.25 3.44 1.56-2.91 1.63-2.38 5.63.47 7.03-.66 1.72-1.56 3.47-3.01 4.38zm-2.09-15c-.47-2.22 1.94-4.13 3.84-4.28.16 2.34-2.5 4.63-3.84 4.28z"></path>
</svg>
<span class="text-xs font-bold uppercase tracking-wide text-gray-700">Apple</span>
</button>
</div>
</div>
<div class="flex-grow"></div>
<div class="mt-6 text-center pb-6">
<p class="text-sm text-brand-text-sub font-medium">
            Not a member?
            <button class="font-extrabold text-brand-orange hover:text-brand-dark-orange transition-colors ml-1 uppercase text-xs tracking-wider" type="button">Create Account</button>
</p>
</div>
</div>
</div>
</body></html>
