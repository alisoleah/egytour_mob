<script>
        // Script to handle radio button styling toggle
        const radios = document.querySelectorAll('input[name="payment_method"]');
        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                // Reset all labels
                radios.forEach(r => {
                    const label = r.closest('label');
                    label.classList.remove('border-primary', 'shadow-glow', 'bg-[#FFF8F4]');
                    label.classList.remove('border-2'); // remove active thickness
                    label.classList.add('border', 'border-border-light', 'bg-white'); // add inactive thickness
                    // Reset icons backgrounds if any specific styles were applied (optional based on CSS structure)
                });
                // Set active label
                const activeLabel = e.target.closest('label');
                activeLabel.classList.remove('border', 'border-border-light', 'bg-white');
                activeLabel.classList.add('border-2', 'border-primary', 'shadow-glow', 'bg-[#FFF8F4]');
            });
        });
    </script>
