<div class="absolute inset-0 bg-gradient-to-b from-brand-black/40 via-brand-black/80 to-brand-black"></div>
<div class="absolute top-0 right-10 h-full w-[1px] bg-brand-orange/20 hidden sm:block"></div>
</div>
<div class="relative z-10 flex flex-col h-full w-full max-w-md mx-auto p-6 pt-10">
<div class="flex items-center justify-between mb-10">
<button class="flex items-center justify-center w-10 h-10 border border-brand-border/50 bg-brand-black/50 backdrop-blur-sm hover:border-brand-orange text-brand-white transition-all">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<div class="font-extrabold text-lg tracking-[0.2em] uppercase text-brand-white">Egytour</div>
<div class="w-10"></div>
</div>
<div class="mb-10 relative">
<div class="absolute -left-6 top-1 h-full w-1 bg-brand-orange"></div>
<h1 class="text-4xl font-black leading-none tracking-tight text-brand-white mb-3">
                    EXPLORE<br/>
<span class="text-brand-orange">THE UNSEEN</span>
</h1>
<p class="text-gray-400 text-sm font-medium leading-relaxed max-w-xs">
                    Access offline maps, 3D tours, and exclusive granular pricing plans.
                </p>
</div>
<div class="flex w-full mb-8 border-b border-brand-border">
<label class="cursor-pointer relative flex-1 pb-3 text-center group">
<span class="text-sm font-bold uppercase tracking-wider text-brand-white group-hover:text-brand-orange transition-colors">Log In</span>
<input checked="" class="hidden peer" name="auth_mode" type="radio" value="login"/>
<div class="absolute bottom-0 left-0 w-full h-[2px] bg-brand-orange scale-x-100 transition-transform origin-left peer-checked:scale-x-100"></div>
</label>
<label class="cursor-pointer relative flex-1 pb-3 text-center group">
<span class="text-sm font-bold uppercase tracking-wider text-gray-500 group-hover:text-brand-white transition-colors">Register</span>
<input class="hidden peer" name="auth_mode" type="radio" value="signup"/>
<div class="absolute bottom-0 left-0 w-full h-[2px] bg-brand-orange scale-x-0 transition-transform origin-left peer-checked:scale-x-100"></div>
</label>
</div>
<form class="flex flex-col gap-6">
<div class="flex flex-col gap-2">
<label class="text-[10px] font-bold uppercase tracking-[0.15em] text-brand-orange">Email Address</label>
<div class="relative group">
<input class="flex w-full rounded-sm border border-brand-border bg-brand-surface/90 px-4 py-4 pl-12 text-base font-medium text-brand-white placeholder:text-gray-600 focus:border-brand-orange focus:ring-0 focus:bg-brand-black outline-none transition-all" placeholder="name@example.com" type="email"/>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 group-focus-within:text-brand-orange transition-colors text-[20px]">mail</span>
</div>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end">
<label class="text-[10px] font-bold uppercase tracking-[0.15em] text-brand-orange">Password</label>
</div>
<div class="relative group">
<input class="flex w-full rounded-sm border border-brand-border bg-brand-surface/90 px-4 py-4 pl-12 pr-12 text-base font-medium text-brand-white placeholder:text-gray-600 focus:border-brand-orange focus:ring-0 focus:bg-brand-black outline-none transition-all" placeholder="Enter password" type="password"/>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 group-focus-within:text-brand-orange transition-colors text-[20px]">lock</span>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-600 hover:text-brand-white transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<div class="flex justify-end">
<a class="text-xs font-semibold text-gray-500 hover:text-brand-white transition-colors" href="#">Recover Password</a>
</div>
</div>
<button class="mt-2 relative overflow-hidden group w-full rounded-sm bg-brand-orange py-4 text-sm font-black uppercase tracking-widest text-white shadow-[0_4px_20px_rgba(255,95,0,0.3)] hover:shadow-[0_4px_25px_rgba(255,95,0,0.5)] transition-all active:scale-[0.99]" type="button">
<div class="absolute inset-0 w-full h-full bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
<span class="relative z-10">Access Account</span>
</button>
</form>
<div class="mt-8 mb-6">
<div class="relative flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-brand-border"></div>
</div>
<span class="relative bg-brand-black px-4 text-[10px] font-bold uppercase tracking-widest text-gray-500">Or continue with</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 rounded-sm bg-brand-white py-3 hover:bg-gray-200 transition-colors">
<svg class="h-4 w-4" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>

</svg>
<span class="text-xs font-bold uppercase tracking-wide text-black">Google</span>
</button>
<button class="flex items-center justify-center gap-2 rounded-sm border border-brand-border bg-brand-surface py-3 hover:border-brand-white transition-colors">
<svg class="h-4 w-4 text-white" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.05 20.28c-.98.95-2.05.88-3.08.38-1.09-.53-2.09-.5-3.2.06-1.53.78-3.08.34-4.22-1.78-2.31-4.34-.34-8.81 3.56-9.13 1.25-.13 2.53.5 3.38.5.78 0 2.22-1 3.66-1 .59.03 2.31.25 3.44 1.56-2.91 1.63-2.38 5.63.47 7.03-.66 1.72-1.56 3.47-3.01 4.38zm-2.09-15c-.47-2.22 1.94-4.13 3.84-4.28.16 2.34-2.5 4.63-3.84 4.28z"></path>
</svg>
<span class="text-xs font-bold uppercase tracking-wide text-white">Apple</span>
</button>
</div>
<div class="flex-grow"></div>
<div class="mt-4 text-center pb-6">
<p class="text-sm text-gray-500">
                    Not a member?
                    <button class="font-bold text-brand-orange hover:text-brand-white transition-colors ml-1 uppercase text-xs tracking-wider" type="button">Create Account</button>
</p>
</div>
</div>
</div>
