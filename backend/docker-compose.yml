services:
  db:
    image: postgis/postgis:16-3.4
    container_name: egytour-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: egytour
    ports:
      - "5433:5432"
    volumes:
      - egytour-pgdata:/var/lib/postgresql/data

volumes:
  egytour-pgdata:
